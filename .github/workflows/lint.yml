name: lint

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: Lint Go Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: "1.20" # Use your desired Go version

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v2
        with:
          only-new-issues: true
